name = "rentalos-inbound-email"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# This Worker has no fetch handler - it is triggered only by Email Routing - so
# it needs no HTTP route. Without this, wrangler deploy stops and asks for a
# workers.dev subdomain, and publishing one would expose an endpoint that
# answers nothing.
workers_dev = false

# postal-mime and supabase-js both run on the Workers runtime without Node
# built-ins, so no nodejs_compat flag is needed.

[vars]
# The app that owns the business logic. This is the canonical host: the apex
# answers 308 to www, and following a redirect on a POST that carries an
# Authorization header is a risk not worth taking. wrangler dev can point this
# at a tunnel or at http://localhost:3000.
APP_URL = "https://www.tedataone.com"

# SUPABASE_URL, SUPABASE_ANON_KEY and INBOUND_SECRET are deliberately absent.
# This repository is public, and even though the first two are not secret - the
# anon key is shipped to every browser - keeping all three in one place means
# there is one answer to "where do the Worker's values live" rather than two.
#
# Set them once each:
#
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_ANON_KEY
#   npx wrangler secret put INBOUND_SECRET
#
# INBOUND_SECRET has to match the app's environment on Vercel, or every request
# from this Worker is refused with 401.
